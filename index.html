<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhà khoa học trẻ HaUI</title>
<style>
:root{
  --bg:#f3f5fc; --surface:#ffffff; --ink:#0b1230; --muted:#4a5578; --line:#dde3f3;
  --accent:#1d4ed8; --accent-ink:#ffffff; --soft:#e6ecff; --accent-text:#1d4ed8; --good:#0f8a5f;
  --font:-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f1f; --surface:#121a2e; --ink:#f2f4fa; --muted:#9aa5c4; --line:#2a3658;
  --accent:#5b8def; --accent-ink:#0a0f1f; --soft:#1a2745; --accent-text:#8fb0ff; --good:#34d399; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1f; --surface:#121a2e; --ink:#f2f4fa; --muted:#9aa5c4; --line:#2a3658;
  --accent:#5b8def; --accent-ink:#0a0f1f; --soft:#1a2745; --accent-text:#8fb0ff; --good:#34d399; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px}
header.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:800;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:4px;margin:14px 0}
.tab{padding:7px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;font:inherit;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.bar input,.bar select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0}
.bar input{flex:1 1 220px}.bar select{flex:0 1 260px}
.stat{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:12px}
.stat b{color:var(--accent-text);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{box-shadow:0 1px 2px rgba(11,18,48,.04);position:relative;text-align:left;display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:8px;font:inherit;cursor:pointer;min-width:0}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none;box-shadow:0 4px 14px rgba(29,78,216,.12)}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-size:15px}
.card .n{font-weight:700;line-height:1.3}
.card .u{color:var(--muted);font-size:12.5px;line-height:1.35}
.mini{margin-top:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:20;max-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;box-shadow:0 8px 28px rgba(11,18,48,.22);pointer-events:none}
.tip b{display:block;margin-bottom:4px}
.tip table{border-collapse:collapse;width:100%}.tip td{padding:1px 0}.tip td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.back{border:0;background:none;color:var(--accent-text);font:inherit;cursor:pointer;padding:4px 0;margin-bottom:8px}
.head{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;flex-wrap:wrap}
.head .av{width:84px;height:84px;font-size:30px}
.head h2{margin:0;font-weight:800;font-size:22px;line-height:1.25}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 24px;margin-top:8px;font-size:14px}
.kv span{color:var(--muted)}
.ids{margin-top:10px;font-size:13px;color:var(--muted)}
.sec{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.sec>h3{margin:0;padding:12px 16px;font-size:15px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.sec>h3 em{font-style:normal;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.sec .empty{padding:12px 16px;color:var(--muted);font-size:14px}
ol.list{margin:0;padding:6px 16px 6px 40px}
ol.list li{padding:8px 0;border-bottom:1px solid var(--line)}ol.list li:last-child{border:0}
.t{font-weight:500}.m{color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--accent-text);margin-right:6px;white-space:nowrap}
.chip.nh{background:transparent;border:1px solid var(--line);color:var(--muted)}.chip.old{border-style:dashed}
.sub2{padding:8px 16px 0;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.note{margin-top:20px;font-size:12.5px;color:var(--muted)}
.pill{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:9px 18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:30}
.pill[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Nhà khoa học trẻ Đại học Công nghiệp Hà Nội</h1>
      <div class="sub" id="scope"></div>
    </div>
  </header>
  <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true">Danh sách</button></div>
  <main id="app"></main>
  <p class="note" id="foot"></p>
  <p class="note"><b>Thực hiện:</b> Bùi Tiến Sơn · Ban Khoa học, Công nghệ và Đổi mới sáng tạo, Đại học Công nghiệp Hà Nội</p>
</div>
<div class="tip" id="tip" hidden></div>
<button class="pill" id="pill" hidden>Đã có phiên bản mới · Tải lại</button>
<script src="data.js"></script>
<script>
(function(){
var D=window.DATA,P=D.people,app=document.getElementById("app");
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ini(n){var w=n.trim().split(/\s+/);return (w[w.length-1][0]+(w.length>1?w[0][0]:"")).toUpperCase()}
function cnt(p){
  var bb=p.cong_bo.filter(function(x){return x.k==="bb"}).length,bc=p.cong_bo.length-bb;
  var sc=p.cong_bo.filter(function(x){return /Scopus\/WoS/.test(x.loai)}).length;
  return {bb:bb,bc:bc,sc:sc,shtt:p.shtt.length,nv:p.nhiem_vu.length,cg:p.cgcn.length,gt:p.giai_thuong.length,sach:p.sach.length,sv:p.hdsv.length};
}
$("#scope").textContent=D.pham_vi+" Cập nhật "+D.cap_nhat+".";
$("#foot").textContent="Nguồn: danh sách nhà khoa học trẻ do Ban Tổ chức - Nhân sự cung cấp; thành tích lấy từ mục Công trình khoa học của DST portal. "+D.ghi_chu_nam_cu+" Phân hạng Scopus/WoS theo Scimago như đã ghi trong phụ lục. "+(D.ghi_chu_shtt||"")+" Các bản ghi trùng họ tên khác năm sinh hoặc đơn vị không được tính; danh sách nghi ngờ do Ban rà lại.";
var state={q:"",u:""};
var units=Array.from(new Set(P.map(function(p){return p.don_vi}))).sort();
function list(){
  var rows=P.filter(function(p){
    return (!state.u||p.don_vi===state.u)&&(!state.q||p.ten.toLowerCase().indexOf(state.q.toLowerCase())>=0);
  });
  var tot=rows.reduce(function(a,p){var c=cnt(p);a.bb+=c.bb;a.sc+=c.sc;a.nv+=c.nv;a.shtt+=c.shtt;return a},{bb:0,sc:0,nv:0,shtt:0});
  app.innerHTML='<div class="bar"><input id="q" type="search" placeholder="Tìm theo họ tên" value="'+esc(state.q)+'" aria-label="Tìm theo họ tên">'+
    '<select id="u" aria-label="Lọc theo đơn vị"><option value="">Tất cả đơn vị</option>'+units.map(function(u){return '<option'+(u===state.u?' selected':'')+'>'+esc(u)+'</option>'}).join('')+'</select></div>'+
    '<div class="stat"><span><b>'+rows.length+'</b> người</span><span><b>'+tot.bb+'</b> bài báo</span><span><b>'+tot.sc+'</b> bài thuộc Scopus/WoS</span><span><b>'+tot.nv+'</b> nhiệm vụ KH&amp;CN</span><span><b>'+tot.shtt+'</b> sở hữu trí tuệ</span></div>'+
    '<div class="grid">'+rows.map(function(p){var c=cnt(p);
      return '<button class="card" data-id="'+p.id+'"><span class="av">'+esc(ini(p.ten))+'</span><span style="min-width:0"><span class="n">'+esc(p.ten)+'</span><br><span class="u">'+esc(p.don_vi)+'</span><div class="mini">'+c.bb+' bài báo · '+c.nv+' nhiệm vụ · '+c.shtt+' SHTT</div></span></button>'}).join('')+'</div>';
  $("#q").oninput=function(e){state.q=e.target.value;var pos=e.target.selectionStart;list();var q=$("#q");q.focus();q.setSelectionRange(pos,pos)};
  $("#u").onchange=function(e){state.u=e.target.value;list()};
}
var tip=$("#tip");
function showTip(el,x,y){
  var p=P.filter(function(q){return q.id==el.dataset.id})[0],c=cnt(p);
  tip.innerHTML='<b>'+esc(p.ten)+'</b><div class="m">'+esc(p.trinh_do)+(p.chuyen_nganh?' · '+esc(p.chuyen_nganh):'')+'</div><table>'+
   [["Bài báo",c.bb+" (Scopus/WoS: "+c.sc+")"],["Báo cáo hội thảo",c.bc],["Nhiệm vụ KH&CN",c.nv],["Sở hữu trí tuệ",c.shtt],["Giải thưởng",c.gt],["Sách",c.sach],["Hướng dẫn SV đạt giải",c.sv]].map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join('')+'</table>';
  tip.hidden=false;var w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.min(x+14,innerWidth-w-8)+"px";tip.style.top=(y+h+18>innerHeight?y-h-10:y+14)+"px";
}
app.addEventListener("mousemove",function(e){var el=e.target.closest(".card");if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true});
app.addEventListener("mouseleave",function(){tip.hidden=true});
app.addEventListener("click",function(e){var el=e.target.closest(".card");if(el){tip.hidden=true;location.hash="p"+el.dataset.id}
  if(e.target.closest(".back")){location.hash=""}});
function item(x,i){
  return '<li><div class="t">'+esc(x.ten)+'</div><div class="m">'+(x.loai?'<span class="chip">'+esc(x.loai)+'</span>':'')+(x.nh?'<span class="chip nh'+(x.nh==='2025-2026'?'':' old')+'" title="'+(x.nh==='2025-2026'?'Đã rà soát':'Chưa rà soát')+'">'+esc(x.nh)+(x.nh==='2025-2026'?'':' · chưa rà soát')+'</span>':'')+[x.noi,x.thoi_gian,x.vai_tro].filter(Boolean).map(esc).join(' · ')+'</div></li>';
}
function sec(title,arr){
  return '<section class="sec"><h3>'+title+'<em>'+arr.length+'</em></h3>'+(arr.length?'<ol class="list">'+arr.map(item).join('')+'</ol>':'<div class="empty">Chưa có dữ liệu trong phạm vi thống kê.</div>')+'</section>';
}
function profile(id){
  var p=P.filter(function(q){return q.id==id})[0];if(!p){location.hash="";return}
  var bb=p.cong_bo.filter(function(x){return x.k==="bb"}),bc=p.cong_bo.filter(function(x){return x.k==="bc"});
  app.innerHTML='<button class="back">← Quay lại danh sách</button>'+
   '<div class="head"><span class="av">'+esc(ini(p.ten))+'</span><div style="min-width:0;flex:1 1 320px"><h2>'+esc(p.ten)+'</h2><div class="m">'+esc(p.don_vi)+'</div>'+
   '<div class="kv"><div><span>Học vị</span><br>'+esc(p.trinh_do)+'</div><div><span>Chuyên ngành</span><br>'+esc(p.chuyen_nganh||"Chưa có")+'</div><div><span>Năm sinh</span><br>'+esc(p.nam)+'</div><div><span>Giới tính</span><br>'+(p.nu?"Nữ":"Nam")+'</div></div>'+
   '<div class="ids">ORCID · Scopus ID · Google Scholar · h-index: chưa có dữ liệu</div></div></div>'+
   '<section class="sec"><h3>1. Công bố khoa học<em>'+p.cong_bo.length+'</em></h3>'+
   (p.cong_bo.length?(bb.length?'<div class="sub2">Bài báo ('+bb.length+')</div><ol class="list">'+bb.map(item).join('')+'</ol>':'')+(bc.length?'<div class="sub2">Báo cáo hội thảo ('+bc.length+')</div><ol class="list">'+bc.map(item).join('')+'</ol>':''):'<div class="empty">Chưa có dữ liệu trong phạm vi thống kê.</div>')+'</section>'+
   sec("2. Sở hữu trí tuệ",p.shtt)+sec("3. Nhiệm vụ KH&amp;CN&amp;ĐMST",p.nhiem_vu)+sec("4. Chuyển giao công nghệ",p.cgcn)+sec("5. Giải thưởng KH&amp;CN&amp;ĐMST",p.giai_thuong)+sec("6. Sách",p.sach)+
   sec("7. Hướng dẫn sinh viên NCKH",p.hdsv)+sec("8. Nhóm nghiên cứu",p.nhom_nc);
  scrollTo(0,0);
}
function route(){tip.hidden=true;var m=/^#p(\d+)$/.exec(location.hash);if(m)profile(m[1]);else list()}
addEventListener("hashchange",route);route();
// báo phiên bản mới
var pill=$("#pill");
function check(){
  if(location.protocol==="file:")return;
  fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(v){if(v.version&&v.version!==D.version)pill.hidden=false}).catch(function(){});
}
pill.onclick=function(){
  var jobs=["./","data.js","version.json"].map(function(u){return fetch(u,{cache:"reload"}).catch(function(){})});
  Promise.all(jobs).then(function(){location.reload()});
};
setInterval(check,60000);check();
})();
</script>
</body>
</html>
